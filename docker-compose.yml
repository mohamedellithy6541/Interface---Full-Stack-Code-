# Starts SQL Server, the API and the Angular front end. Copy .env.example to .env first, then run:
#   docker compose up --build -d
# Front end: http://localhost:8080   API + Swagger: http://localhost:5019/swagger
name: interface-payroll

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "1434:1433"   # 1434 on the host so it does not clash with a local SQL Server on 1433
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: ./back
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=InterfacePayroll;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      AutoMapper__LicenseKey: ${AUTOMAPPER_LICENSE_KEY:-}
      Database__InitializeOnStartup: "true"
      Seed__Enabled: "true"
      Seed__DemoPassword: ${SEED_DEMO_PASSWORD:?Set SEED_DEMO_PASSWORD in .env}
      Seed__GoogleHrEmails__0: ${GOOGLE_HR_EMAIL:-}
      Swagger__Enabled: "true"
      Cors__AllowedOrigins__0: "http://localhost:8080"   # the front container
      Cors__AllowedOrigins__1: "http://localhost:4200"   # ng serve during development
    ports:
      - "5019:8080"
    restart: unless-stopped

  front:
    build:
      context: ./Front
      args:
        API_BASE_URL: "http://localhost:5019"   # called by the browser, so it is the host port of the api service
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  sqlserver-data:
