<div class="login">
  <section class="login__card card">
    <div class="login__brand">
      <span class="login__mark" aria-hidden="true">I</span>
      <h1>Interface Payroll</h1>
      <p class="muted">Sign in to manage employees and payslips.</p>
    </div>

    @if (error(); as message) {
      <div class="alert alert--error" role="alert"><p>{{ message }}</p></div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="login__form">
      <div class="field">
        <label class="field__label" for="email">Email</label>
        <input id="email" class="input" type="email" formControlName="email" autocomplete="username" />
        <app-field-error [control]="form.controls.email" label="Email" />
      </div>

      <div class="field">
        <label class="field__label" for="password">Password</label>
        <input id="password" class="input" type="password" formControlName="password" autocomplete="current-password" />
        <app-field-error [control]="form.controls.password" label="Password" />
      </div>

      <button type="submit" class="btn login__submit" [disabled]="signingIn()">
        {{ signingIn() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <div class="login__divider"><span>or</span></div>
    <app-google-sign-in-button [clientId]="googleClientId" (credential)="signInWithGoogle($event)" />

    @if (showDemoAccounts) {
      <div class="alert alert--info login__demo">
        <p><strong>Demo accounts</strong> (password <code>Demo&#64;12345</code>)</p>
        <ul>
          <li><button type="button" class="btn btn--link" (click)="useDemoAccount('hr@interface.local')">hr&#64;interface.local</button> HR, full access</li>
          <li><button type="button" class="btn btn--link" (click)="useDemoAccount('sara.ali@interface.local')">sara.ali&#64;interface.local</button> Employee, own payslip only</li>
        </ul>
      </div>
    }
  </section>
</div>
